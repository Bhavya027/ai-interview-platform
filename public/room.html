<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Coding Room</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 16px; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    input { padding: 8px; flex: 1; }
    button { padding: 8px 16px; cursor: pointer; }
    textarea { width: 100%; height: 350px; font-family: monospace; font-size: 15px; padding: 10px; box-sizing: border-box; }
    #status { margin: 8px 0; font-weight: bold; color: #2a7a2a; }
    #status.error { color: #c0392b; }
    #log { color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <h2>Live Coding Room</h2>

  <div id="loginBox" class="row">
    <input id="emailInput" placeholder="Email" />
    <input id="passwordInput" type="password" placeholder="Password" />
    <button id="loginBtn">Login</button>
  </div>

  <div id="joinBox" class="row" style="display:none">
    <input id="interviewInput" placeholder="Interview ID (example: 1)" />
    <button id="joinBtn">Join Room</button>
  </div>

  <button id="endBtn" style="display:none; margin-bottom:12px">End Interview</button>

  <div id="status">Please login</div>

  <textarea id="editor" placeholder="Join an interview room, then start typing code here..." disabled></textarea>

  <div id="log"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket = null;

    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginBox = document.getElementById('loginBox');
    const joinBox = document.getElementById('joinBox');
    const interviewInput = document.getElementById('interviewInput');
    const joinBtn = document.getElementById('joinBtn');
    const endBtn = document.getElementById('endBtn');
    const editor = document.getElementById('editor');
    const status = document.getElementById('status');
    const log = document.getElementById('log');

    function setStatus(message, isError) {
      status.textContent = message;
      status.className = isError ? 'error' : '';
    }

    function addLog(message) {
      const line = document.createElement('div');
      line.textContent = message;
      log.appendChild(line);
    }

    function connectSocket(token) {
      socket = io({ auth: { token } });

      socket.on('connect_error', (err) => {
        setStatus('Connection failed: ' + err.message, true);
      });

      socket.on('joined', ({ roomId, name, role }) => {
        editor.disabled = false;
        setStatus('Joined ' + roomId + ' as ' + name + ' (' + role + ')', false);
        if (role === 'interviewer') {
          endBtn.style.display = 'inline-block';
        }
      });

      socket.on('join-error', (message) => {
        editor.disabled = true;
        setStatus(message, true);
      });

      socket.on('code-update', (code) => { editor.value = code; });
      socket.on('user-joined', ({ name }) => addLog(name + ' joined the room'));
      socket.on('user-left', ({ name }) => addLog(name + ' left the room'));

      socket.on('interview-ended', () => {
        editor.disabled = true;
        endBtn.style.display = 'none';
        setStatus('Interview ended. Code has been saved.', false);
      });
    }

    loginBtn.addEventListener('click', async () => {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: emailInput.value.trim(),
          password: passwordInput.value
        })
      });
      const data = await res.json();

      if (!res.ok) {
        setStatus(data.message, true);
        return;
      }

      loginBox.style.display = 'none';
      joinBox.style.display = 'flex';
      setStatus('Logged in as ' + data.user.name + ' (' + data.user.role + ')', false);
      connectSocket(data.token);
    });

    joinBtn.addEventListener('click', () => {
      const interviewId = interviewInput.value.trim();
      if (!interviewId) {
        setStatus('Please enter an interview ID', true);
        return;
      }
      socket.emit('join-room', { interviewId });
    });

    endBtn.addEventListener('click', () => {
      socket.emit('end-interview');
    });

    editor.addEventListener('input', () => {
      socket.emit('code-change', { code: editor.value });
    });
  </script>
</body>
</html>
